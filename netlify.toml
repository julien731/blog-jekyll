[build]
  # Pin Node.js to a compatible version (20.x supports the latest plugin)
  node_version = "20"

[[plugins]]
  # Installs the latest compatible version of the Lighthouse Build Plugin
  package = "@netlify/plugin-lighthouse"

[[plugins]]
  # Generates a sitemap.
  package = "@netlify/plugin-sitemap"

[[context.production.plugins]]
  package = "netlify-purge-cloudflare-on-deploy"